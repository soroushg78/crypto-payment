server {
    listen 80;
    server_name geopooshgroup.ir www.geopooshgroup.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    index index.php index.html;
    server_name geopooshgroup.ir www.geopooshgroup.ir;

    root /var/www/html/public;

    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/geopooshgroup.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geopooshgroup.ir/privkey.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri $uri/ =404;
        expires max;
        log_not_found off;
        access_log off;
    }

    location ~* \.(js|css|map|json|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|mp4)$ {
        try_files $uri $uri/ /index.php?$query_string;
        expires max;
        log_not_found off;
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}

# ==========================================
# Crypto Service (crypto.geopooshgroup.ir)
# ==========================================
server {
    listen 80;
    server_name crypto.geopooshgroup.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name crypto.geopooshgroup.ir;

    ssl_certificate /etc/letsencrypt/live/geopooshgroup.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geopooshgroup.ir/privkey.pem;

    location / {
        root /var/www/crypto;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://crypto_backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://crypto_backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
